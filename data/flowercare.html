<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <meta charset='utf-8'/>
    <script language='javascript' type='text/javascript' src='./esp/gpio.js'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css' >
    <link rel='stylesheet' type='text/css' href='./Style.css'/>
    <script language='javascript' type='module' src='./Javascript.js'></script>
    
    <script type='module'>
      import { delrow, addrow } from './valvefunctions.js';
      import { init, scanBLE, ActivateDevice } from './flowercare.js';
      import { onSubmit, initDataValues } from './Javascript.js';
      window.onSubmit = onSubmit;
      window.initDataValues = initDataValues;
      window.scanBLE = scanBLE;
      window.ActivateDevice = ActivateDevice;
      window.addrow = addrow;
      window.deleteRow = delrow;

      window.addEventListener('DOMContentLoaded', init, false);

      import { initExternalSite } from './navi.js';
      window.initExternalSite = initExternalSite;
      window.addEventListener('DOMContentLoaded', () => initExternalSite(document), false);
    </script>

    <title>PumpControl</title>
  </head>
  <body>
    <div id="loader"></div>
    <button onclick="onSubmit('DataForm', 'active.*');initDataValues();" style="position: fixed; top: 0; left: 0;">Save</button>
    <button onclick="scanBLE()" id="btn_scan" class="hide" style="position: fixed; top: 30px; left: 0;">Scan for BLE Devices</button>

    <div id="needToSave" class="hide needToSave">
      <i class="fa fa-exclamation-triangle" style="color: gold; font-size: 20px;"></i>
      <span style="font-size: 70%;">Änderungen nicht gespeichert</span>
    </div>

    <form id='DataForm'>
      <table id='fc_devices_table' class='editorDemoTable hide'>
        <thead>
          <tr>
            <td style='width: 50px;'>activ</td>
            <td style='width: 150px;'>
                <span title="MAC-Address of the FlowerCare device">address
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
                </span>
            </td>
            <td style='width: 50px;'>moisture</td>
            <td style='width: 50px;'>brightness</td>
            <td style='width: 50px;'>temperature</td>
            <td style='width: 50px;'>fertility</td>
            <td style='width: 50px;'>battery</td>
            <td style='width: 150px;'>
                <span title="Elapsed time since last update">lastUpdate
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
                </span>
            </td>
          </tr>
        </thead>
        <tbody>
          <template id='flowercare'>
            <tr>
              <td><input type='checkbox' onclick='ActivateDevice(this.id)' id='active' name="active" role='tooltip_simple'></td>
              <td>
                <dfn class='tooltip_simple'>
                  <input type="text" id='address' name='address' readonly style='width: 150px;'>
                  <span role='tooltip_simple'>
                    <b>MQTT-Topic:</b><br><span id='mqtttopic'></span>
                  </span>
                </dfn>
              </td>
              <td><span id='moisture' class='ajaxchange'></span>%</td>
              <td><span id='brightness' class='ajaxchange'></span> lux</td>
              <td><span id='temperature' class='ajaxchange'></span>°C</td>
              <td><span id='fertility' class='ajaxchange'></span>µS/cm</td>
              <td><span id='battery' class='ajaxchange'></span>%</td>
              <td> 
                <div>LiveData:<span id="lastLiveDataUpdate" class='ajaxchange' style="float: right;"></span></div>
                <div>Battery: <span id="lastBatteryUpdate" class='ajaxchange' style="float: right;"></span></div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    
    <br>
    <div id="footer"></div>
  </body>
</html>
