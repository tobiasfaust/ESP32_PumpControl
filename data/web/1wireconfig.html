<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <meta charset='utf-8'/>

    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css' >
    <link rel='stylesheet' type='text/css' href='/web/Style.css'/>
    <script language='javascript' type='module' src='/web/Javascript.js'></script>
    <script language='javascript' type='module' src='/web/1wireconfig.js'></script>
    
    <script type='module'>
      import { init } from './1wireconfig.js';

      window.addEventListener('DOMContentLoaded', init, false);
    </script>

    <title>Pumpcontrol</title>
  </head>
  <body>
    <div id="loader"></div>
    <table id='maintable' class='editorDemoTable'>
    <thead>
      <tr>
        <td style='width: 25px;'>Nr</td>
        <td style='width: 75px;'>Typ</td>
        <td style='width:150px;'>ID</td>
        <td style='width:  80px;'>Port</td>
      </tr>
    </thead>
    <tbody>

    <template id="row">
      <tr>
        <td></td>
        <td>DS2408</td>
        <td id="device"></td>      
        <td>
          <table>
            <template id="ports">
              <tr>
                <td id="port"></td>
              </tr>
            </template>
          </table>
        </td>

      </tr>
    </template>

    </tbody>
    </table>

    <br>
    <div style="position: fixed; bottom: 0; width: 100%; height: 20px; background-color: lightblue; text-align: center;">
      <div style="font-size: 10px; float: right;">
        Connection Status:
        <span id="ws-status" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: red; margin-right: 25px; margin-top: 7px;"></span>
      </div>
      <span style="float: left; margin-top: 2px;" id='response'>x</span>
    </div>
    
  </body>
</html>
