<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <meta charset='utf-8'/>
    <script language='javascript' type='text/javascript' src='/web/esp/gpio.js'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css' >
    <link rel='stylesheet' type='text/css' href='/web/Style.css'/>
    <script language='javascript' type='module' src='/web/Javascript.js'></script>
    
    <script type='module'>
      import { delrow, addrow } from './valvefunctions.js';
      import { init, scanBLE, ActivateDevice, ActivateRelation } from './flowercare.js';
      import { onSubmit, initDataValues } from './Javascript.js';
      window.onSubmit = onSubmit;
      window.initDataValues = initDataValues;
      window.scanBLE = scanBLE;
      window.ActivateDevice = ActivateDevice;
      window.ActivateRelation = ActivateRelation;
      window.addrow = addrow;
      window.deleteRow = delrow;

      window.addEventListener('DOMContentLoaded', init, false);
    </script>

    <title>PumpControl</title>
  </head>
  <body>
    <div id="loader"></div>
    <button onclick="onSubmit('DataForm', 'active.*');initDataValues();" style="position: fixed; top: 0; left: 0;">Save</button>
    <button onclick="scanBLE()" style="position: fixed; top: 0; left: 100px;">Scan for BLE Devices</button>

    <div id="needToSave" class="hide needToSave">
      <i class="fa fa-exclamation-triangle" style="color: gold; font-size: 20px;"></i>
      <span style="font-size: 70%;">Änderungen nicht gespeichert</span>
    </div>

    <form id='DataForm'>
      <table id='maintable' class='editorDemoTable'>
        <thead>
          <tr>
            <td style='width: 50px;'>activ</td>
            <td style='width: 150px;'>
                <span title="MAC-Address of the FlowerCare device">address
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
                </span>
            </td>
            <td style='width: 50px;'>moisture</td>
            <td style='width: 50px;'>brightness</td>
            <td style='width: 50px;'>temperature</td>
            <td style='width: 50px;'>fertility</td>
            <td style='width: 50px;'>battery</td>
            <td style='width: 150px;'>
                <span title="Elapsed time since last update">lastUpdate
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
                </span>
            </td>
          </tr>
        </thead>
        <tbody>
          <template id='flowercare'>
            <tr>
              <td><input type='checkbox' onclick='ActivateDevice(this.id)' id='active' name="active" role='tooltip_simple'></td>
              <td>
                <dfn class='tooltip_simple'>
                  <input type="text" id='address' name='address' readonly style='width: 150px;'>
                  <span role='tooltip_simple'>
                    <b>MQTT-Topic:</b><br><span id='mqtttopic'></span>
                  </span>
                </dfn>
              </td>
              <td><span id='moisture'></span>%</td>
              <td><span id='brightness'></span> lux</td>
              <td><span id='temperature'></span>°C</td>
              <td><span id='fertility'></span>µS/cm</td>
              <td><span id='battery'></span>%</td>
              <td> 
                <div>LiveData:<span id="lastLiveDataUpdate" style="float: right;"></span></div>
                <div>Battery: <span id="lastBatteryUpdate" style="float: right;"></span></div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
            
      <button type="button" onclick="addrow('fc_relations_table')" style="position: relative; left: 0;">add Row</button>
      <table id="fc_relations_table" class="editorDemoTable">
        <thead>
          <tr>
            <td style='width: 25px;'>Nr</td>
            <td style='width: 50px;'>Aktiv</td>
            <td style='width: 300px;'>
                <span title="MQTT-Topic of a flowercare device to be reacted upon">MQTT-Topic
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
                </span>
            </td>
            <td style='width: 100px;'>
                <span title="Valve to be activated when the soil moisture threshold received in the MQTT topic is below the set value">Port
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
                </span>
            </td>
            <td style='width: 100px;'>
              <span title="turn valve on if moinsture is lower than this threshold">threshold
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
              </span>
            </td>
            <td style='width: 100px;'>
              <span title="turn valve on for x seconds">duration
                <i class="fa fa-question-circle" style="font-size: 12px; cursor: pointer; color: gold;"></i>
              </span>
            </td>
            <td style='width: 50px;'>delete</td>
          </tr>
        </thead>

        <tbody>
          <template id='fc_relations'>
            <tr>
              <td></td>
              <td><input type='checkbox' onclick='ActivateRelation(this.id)' id='active' name='active'></td>
              <td><input type='text' name='mqtttopic' id='mqtttopic' style='width: 300px;'></td>
              <td><input id='ConfiguredPort' name='port' type='number' min='10' max='999'/></td>
              <td><input type='number' id='threshold' name="threshold" style='width: 50px;'></td>
              <td><input type='number' id='duration' name="duration" style='width: 50px;'></td>
              <td><button type="button"  onclick='deleteRow(this)'>
                <i class='fa fa-trash'></i>
              </button></td>
            </tr>
          </template>
        </tbody>
      </table>
    </form>
    
    <br>
    <div style="position: fixed; bottom: 0; width: 100%; height: 20px; background-color: lightblue; text-align: center;">
      <div style="font-size: 10px; float: right;">
        Connection Status:
        <span id="ws-status" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: red; margin-right: 25px; margin-top: 7px;"></span>
      </div>
      <span style="float: left; margin-top: 2px;" id='response'>x</span>
    </div>
  </body>
</html>
