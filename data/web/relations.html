<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <meta charset='utf-8'>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css' >
    <link rel='stylesheet' type='text/css' href='/web/Style.css'>
    <script language='javascript' type='text/javascript' src='/web/esp/gpio.js'></script>

    <script language='javascript' type='module' src='/web/Javascript.js'></script>
    <script language='javascript' type='module' src='/web/valvefunctions.js'></script>
    <script language='javascript' type='module' src='/web/relations.js'></script>
    
    
    <script type='module'>
      import { init } from './relations.js';
      import { onSubmit, radioselection, initDataValues } from './Javascript.js';
      import { addrow, delrow } from './valvefunctions.js';
      window.onSubmit = onSubmit;
      window.radioselection = radioselection;
      window.initDataValues = initDataValues;
      window.addrow = addrow;	
      window.delrow = delrow;

      window.addEventListener('DOMContentLoaded', init, false);
    </script>

    <title>Pumpcontrol</title>
  </head>
  <body>
    <div id="loader"></div>    
    <button onclick="onSubmit('DataForm', 'active.*');initDataValues();" style="position: fixed; top: 0; left: 0;">Save</button>
    
    <div id="needToSave" class="hide needToSave">
      <i class="fa fa-exclamation-triangle" style="color: gold; font-size: 20px;"></i>
      <span style="font-size: 70%;">Änderungen nicht gespeichert</span>
    </div>

    <button onclick="addrow('maintable')" style="position: fixed; top: 0; left: 75px;">&#10010; add new Port</button>
    
    <form id='DataForm'>
      <table id='maintable' class='editorDemoTable'>
        <thead>
          <tr>
            <td style='width: 25px;'>Nr</td>
            <td style='width: 25px;'>Active</td>
            <td style='width: 250px;'>Trigger Topic</td>
            <td style='width: 250px;'>Port</td>
            <td style='width: 25px;'>Enable if Bypass</td>
            <td style='width: 25px;'>Delete</td>

          </tr>
        </thead>
      <tbody>
        <template id="rows">
          <tr>
            <td></td>
            <td>
              <input id="active" type='checkbox' name='active'>
            </td>

            <td><input id='mqtttopic' name='mqtttopic' type='text' size='30'/></td>
            <td><input id='ConfiguredPort' name='port' type='number' min='10' max='999'/></td>
          
            <td>
              <input type='checkbox' name='EnableByBypass' id='EnableByBypass'>
            </td>
              
            <td><input type='button' value='&#10008;' onclick='delrow(this)'></td>
          </tr>
        </template>
      </tbody>
      </table>
    </form><br />
      
    <br>
    <div style="position: fixed; bottom: 0; width: 100%; height: 20px; background-color: lightblue; text-align: center;">
      <div style="font-size: 10px; float: right;">
        Connection Status:
        <span id="ws-status" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: red; margin-right: 25px; margin-top: 7px;"></span>
      </div>
      <span style="float: left; margin-top: 2px;" id='response'>x</span>
    </div>
  </body>
</html>
