<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <meta charset='utf-8'/>
    <link rel='stylesheet' type='text/css' href='./Style.css'/>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css' >
    <script language='javascript' type='module' src='./Javascript.js'></script>
    <script language='javascript' type='module' src='./navi.js'></script>

    <script type='module'>
      import { init, highlightNavi, showUpdateInfoInMainFrame } from './navi.js';
      window.highlightNavi = highlightNavi;
      window.showUpdateInfoInMainFrame = showUpdateInfoInMainFrame;
  
      window.addEventListener('load', init, false);
    </script>

    <title>PumpControl</title>
  </head>
  <body>
    <table>
      <tr>
        <td colspan='11'>
          <b>Configuration</b> of
          <i><span style='color:#CCCCCC;' id='hostname'></span></i>
        </td>
  
        <td colspan='14'>
          <span id="updateInfoItem" class="hide" onclick="showUpdateInfoInMainFrame()">
            <i class="pulse fa fa-info-circle" style="color: green; font-size: 20px;"></i>
          </span>
          <b>Release: </b>
            <span style='color:orange;'>
              <span id='releasename'></span>
            </span><br>of 
            <span id='releasedate'></span>
            <span id='releasetime'></span>
        </td>
      </tr>
      <tr>
        <td class='navi' style='width: 50px'></td>
        <td class='navi navi_active' name='navi' id='status' onclick='highlightNavi(this)' style='width: 100px'><a href='./status.html' target="frame_main">Status</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class='navi' name='navi' id='baseconfig' onclick='highlightNavi(this)' style='width: 100px'><a href='./baseconfig.html' target="frame_main">Basis Config</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class='navi' name='navi' id='sensorconfig' onclick='highlightNavi(this)' style='width: 100px'><a href='./sensorconfig.html' target="frame_main">Sensor Config</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class='navi' name='navi' id='ventilconfig' onclick='highlightNavi(this)' style='width: 100px'><a href='./valveconfig.html' target="frame_main">Ventil Config</a></td>
        
        <td class='navi' id="td_1wire_0" style='width: 50px'></td>
        <td class='navi' name='navi' id='1wireconfig' onclick='highlightNavi(this)' style='width: 100px'><a href='./1wireconfig.html' target="frame_main">1wire Config</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class='navi' name='navi' id='relations' onclick='highlightNavi(this)' style='width: 100px'><a href='./relations.html' target="frame_main">Relationen</a></td>
        
        <td class='navi' id="td_flowercare" style='width: 50px'></td>
        <td class="navi" name='navi' id='flowercare' onclick='highlightNavi(this)' style='width: 100px'><a href='./flowercare.html' target="frame_main">FlowerCare</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class="navi" name='navi' id='flowcontrol' onclick='highlightNavi(this)' style='width: 100px'><a href='./flowcontrol.html' target="frame_main">FlowControl</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class="navi" name='navi' id='doif' onclick='highlightNavi(this)' style='width: 100px'><a href='./doif.html' target="frame_main">DoIF</a></td>

        <td class='navi' style='width: 50px'></td>
        <td class='navi' name='navi' id='handleFiles' onclick='highlightNavi(this)' style='width: 100px'><a href='./handlefiles.html' target="frame_main">Files</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class='navi' name='navi' id='wiki' style='width: 100px'><a href='https://github.com/tobiasfaust/ESP32_PumpControl/wiki' target='_blank'>Wiki</a></td>
        
        <td class='navi' style='width: 50px'></td>
        <td class='navi'>
          <form style='margin: -5px' action="https://www.paypal.com/donate" method="post" target="_blank">
            <input type="hidden" name="hosted_button_id" value="RYUQVSNNTP3N6" />
            <input type="image" style='margin: -5px; padding: 0px; border: 0px;' src="https://www.paypalobjects.com/en_US/i/btn/btn_donate_LG.gif" name="submit" title="If you think the project is great, I would be happy about a donation to be able to integrate paid extensions. I want to integrate the professional ElegantOTA Edition but it costs 300€." alt="please by me a coffee" />
            </form>
        </td>

        <td class='navi' style='width: 50px'></td>
      </tr>
    </table>

    <div id="showUpdateInfo" class="hide" style="position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 330px; height: 150px; border: 2px solid blue; border-radius: 10px; text-align: center; background-color: white;">
      <span style="font-size: 70%;">An update is available</span><br>
      <span style="font-size: 50%;">You are using: <span id="currentVersion"></span></span><br>
      <span style="font-size: 50%;">available version: <span id="newVersion"></span></span>
      <p></p>
      <button class="button" onclick="top.frames['frame_main'].document.getElementById('showUpdateInfo').classList.add('hide');">Close</button>
      <button class="button" onclick='top.frames["frame_main"].location.href="/update"'>Update</button>
    </div>

    <template id="footer">
      <div id="logView" style="display: none; position: fixed; bottom: 22px; left: 10px; width: 400px; height: 60px; overflow-y: auto; white-space: nowrap; border: 1px solid blue; background-color: white; font-family: 'Courier New', monospace; font-size: 11px; text-align: left;"></div>
      <div style="position: fixed; bottom: 0; width: 100%; height: 20px; background-color: lightblue; text-align: center;">
        <table style="width: 100%"><tr>
          <td style="width: 33%">
            <i class="fa fa-list" style="color: green; font-size: 15px; float: left; padding-left: 10px;" title="show log" onclick="toggleView()"></i>
          </td>
          <td style="width: 33%">
            <div id="footer-response" style="font-size: 12px;"></div>
          </td>
          <td style="width: 33%">
            <div style="font-size: 10px; float: right;">
              Connection Status:
              <span id="ws-status" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: red; margin-right: 25px; margin-top: 3px;"></span>
            </div>
          </td> 
        </tr></table>
      </div>
    </template>
    
  </body>
</html>
