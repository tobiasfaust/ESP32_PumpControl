    ${env.custom_lib_deps_pfc8574}
    ${env.custom_lib_deps_tb6612}
    ${env.custom_lib_deps_i2c}
    ${env.custom_lib_deps_onewire}
    ${env.custom_lib_deps_oled}
    ${env.custom_lib_deps_ads1115}
build_flags = ${env.build_flags}
    -D GIT_VARIANT=\"Standard\"
    -D USE_PCF8574=1
    -D USE_TB6612=1
    -D USE_ONEWIRE=1
    -D USE_OLED=1
    -D USE_ADS1115=1
    -D USE_FLOWCONTROL=1
    -D USE_DOIF=1
build_src_filter = +<*> -<flowercare.*>

###################################
[env:firmware_ESP32-S3]
board = esp32-s3-devkitc-1
lib_deps = ${env.lib_deps}
    ${env.custom_lib_deps_pfc8574}
    ${env.custom_lib_deps_tb6612}
    ${env.custom_lib_deps_i2c}
    ${env.custom_lib_deps_onewire}
    ${env.custom_lib_deps_oled}
    ${env.custom_lib_deps_ads1115}
build_flags = ${env.build_flags}
    -D GIT_VARIANT=\"Standard\"
    -D USE_PCF8574=1
    -D USE_TB6612=1
    -D USE_ONEWIRE=1
    -D USE_OLED=1
    -D USE_ADS1115=1
    -D USE_FLOWCONTROL=1
    -D USE_DOIF=1
build_src_filter = +<*> -<flowercare.*>

###################################
[env:firmware_ESP32-C3]
board = esp32-c3-devkitm-1
lib_deps = ${env.lib_deps}
;    ${env.custom_lib_deps_pfc8574}
;    ${env.custom_lib_deps_tb6612}
;    ${env.custom_lib_deps_i2c}
;    ${env.custom_lib_deps_onewire}
;    ${env.custom_lib_deps_oled}
;    ${env.custom_lib_deps_ads1115}
build_flags = ${env.build_flags}
    -D GIT_VARIANT=\"Standard\"
    -D ARDUINO_USB_MODE=1 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USE_PCF8574=1
    -D USE_TB6612=1
    -D USE_ONEWIRE=1
    -D USE_OLED=1
    -D USE_ADS1115=1
    -D USE_FLOWCONTROL=1
    -D USE_DOIF=1
build_src_filter = +<*> -<flowercare.*>

###################################
[env:firmware_ESP8266]
platform = espressif8266
board = nodemcuv2
monitor_filters = esp8266_exception_decoder
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    -D GIT_VARIANT=\"Standard\"
build_src_filter = +<*> -<tb6612.*> -<ow2408.*> -<oled.*> -<pcf8574.*> -<ads1115.*> -<oneWire.*> -<i2cdetect.*> -<motor.*> -<flowercare.*> -<flowcontrol.*> -<doif.*>
