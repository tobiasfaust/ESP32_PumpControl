--------- define PumpControl Device ---------
defmod PC_Tomaten MQTT_DEVICE
attr PC_Tomaten DbLogExclude .*
attr PC_Tomaten IODev mqtt
attr PC_Tomaten alias Tomaten
attr PC_Tomaten group PumpControl Home
attr PC_Tomaten publishSet_on-for-timer home/PumpControl/Tomaten/on-for-timer
attr PC_Tomaten readingsWatcher 300,,DeviceStatus
attr PC_Tomaten room Aussen
attr PC_Tomaten stateFormat VentilStatus (DeviceStatus) (active)
attr PC_Tomaten subscribeReading_DeviceStatus home/PumpControl/state
attr PC_Tomaten subscribeReading_VentilStatus home/PumpControl/Tomaten/state

--------- define BLE Flowercare Bewässerungssensor Tomaten  ---------
defmod BF_Tomaten MQTT_DEVICE
attr BF_Tomaten DbLogExclude transmission-state
attr BF_Tomaten IODev mqtt
attr BF_Tomaten readingsWatcher 660,,data
attr BF_Tomaten room Aussen
attr BF_Tomaten stateFormat moisture% | Bat: batteryLevel% (active)
attr BF_Tomaten subscribeReading_data flowercare/c4:7c:8d:64:42:d0
attr BF_Tomaten userReadings moisture:data:.* {json2nameValue($eventValue)->{moisture}},\
batteryLevel:data:.* {json2nameValue($eventValue)->{battery}},\
fertility:data:.* {json2nameValue($eventValue)->{fertility}}


--------- define DOIF Bewässerung Tomaten  ---------
defmod DOIF_Bew_Tomaten DOIF (([$SELF:1-time] ne "00:00" and [[$SELF:1-time]]) and [$SELF:2-treshold-moisture,0] > 0  and [?BF_Zaun_BeetVorne:moisture]<=[$SELF:2-treshold-moisture,99] and [?AgroWeather:fc0_rain]<[$SELF:2-treshold-rain,99])\
  (set PC_Tomaten on-for-timer [$SELF:0-duration])\
DOELSEIF\
(([$SELF:1-time] ne "00:00" and [[$SELF:1-time]]) and [$SELF:2-treshold-moisture,0] == 0 and [?AgroWeather:fc0_rain]<[$SELF:2-treshold-rain,99])\
  (set PC_Tomaten on-for-timer [$SELF:0-duration])\
DOELSEIF\
(([$SELF:1-time] eq "00:00" and [$SELF:2-treshold-moisture,0] > 0 and [BF_Zaun_BeetVorne:moisture]<=[$SELF:2-treshold-moisture,99] and [?AgroWeather:fc0_rain]<[$SELF:2-treshold-rain,99]))\
  (set PC_Tomaten on-for-timer [$SELF:0-duration])\
DOELSEIF\
([$SELF:1-time] ne "00:00" and [$SELF:2-time] ne "00:00" and ([[$SELF:1-time]-[$SELF:2-time]]) and [$SELF:2-treshold-moisture,0] > 0 and [BF_Zaun_BeetVorne:moisture]<=[$SELF:2-treshold-moisture,99])\
  (set PC_Tomaten on-for-timer [$SELF:0-duration])\
DOELSEIF\
([$SELF:1-treshold-moisture,0] > 0 and [BF_Zaun_BeetVorne:moisture]<=[$SELF:1-treshold-moisture,99] )\
  (set PC_Tomaten on-for-timer [$SELF:0-duration])\
DOELSE
attr DOIF_Bew_Tomaten DbLogExclude .*
attr DOIF_Bew_Tomaten comment cmd_1: Zeitpunkt und SollSensorFeuchte gesetzt\ cmd_2: Zeitpunkt gesetzt, keine SollSensorFeuchte\ cmd_3: Zeitpunkt nicht gesetzt, SollSensorFeuchte gesetzt\ cmd_4: Zeitraum und SollSensorFeuchte gesetzt\ cmd_5: Mindestfeuchte gesetzt, ohne Beruecksichtigung der Regenwarscheinlichkeit\ cmd_6: mache nix
attr DOIF_Bew_Tomaten do always
attr DOIF_Bew_Tomaten readingList 1-treshold-moisture 2-treshold-moisture 2-treshold-rain 0-duration 1-time 2-time
attr DOIF_Bew_Tomaten room Aussen
attr DOIF_Bew_Tomaten verbose 3